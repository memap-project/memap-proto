syntax = "proto3";

package proto;

option go_package = "github.com/memap-project/memap-proto/gen/memapv1/go";

enum CommandType {
  UNKNOWN = 0;

  CREATE = 1;
  DROP = 2;
  ERASE = 3;
  FLUSH = 4;

  GET = 5;
  SET = 6;
  DEL = 7;
  EXPIRE = 8;
  TTL = 9;

  HGET = 10;
  HSET = 11;
  HDEL = 12;
  HEXPIRE = 13;
  HTTL = 14;
  HEXIST = 15;
  HLEN = 16;
  HKEYS = 17;
  HVALS = 18;

  HFGET = 19;
  HFSET = 20;
  HFDEL = 21;

  CINIT = 23;
  SLIMIT = 24;
  GLIMIT = 25;
  CGET = 26;
  CDEL = 27;
  CEXPIRE = 28;
  CTTL = 29;
  INCRBY = 30;
  DECRBY = 31;

  PING = 32;
}

message Request {
  CommandType command = 1;
  string namespace = 2;
  string key = 3;
  string value = 4;
  string field = 5;
  int64 ttl = 6;
}

message Response {
  bool success = 1;
  string string_value = 2;
  map<string, string> hash_value = 3;
  repeated string list_values = 4;
  int64 int_value = 5;
  string error = 6;
}
