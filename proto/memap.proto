syntax = "proto3";

package proto;

option go_package = "github.com/memap-project/memap-proto/gen/memapv1/go";

enum CommandType {
  UNKNOWN = 0;
  
  // Creates namespace if not exists
  CREATE_NS = 1;
  // Deletes namespace if exists
  DELETE_NS = 2;
  // Deletes all namespaces and keys
  ERASE = 3;
  // Deletes all keys
  FLUSH = 4;

  // Sets key-value pair
  SET = 5;
  // Gets value by key
  GET = 6;
  // Deletes key
  DEL = 7;
  // Sets expiration time for key
  EXPIRE = 8;

  // Sets field-value pair in hash
  HSET = 9;
  // Gets value by field in hash
  HGET = 10;
  // Deletes field in hash
  HDEL = 11;
  // Sets expiration time for hash
  HEXPIRE = 12;
  // Gets field-value pair in hash field
  HFGET = 13;
  // Sets field-value pair in hash field
  HFSET = 14;
  // Deletes field in hash field
  HFDEL = 15;

  // Checks if server is alive
  PING = 16;
}

message Request {
  CommandType type = 1;
  string key = 2;
  string value = 3;
  string field = 4;
  string namespace_name = 5;
  int64 ttl_seconds = 6;
}

message Response {
  bool success = 1;
  string value = 2;
  map<string, string> hash_value = 3;
  string error_message = 4;
}
